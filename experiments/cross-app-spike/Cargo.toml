# Experimental spike, not a product crate. It is its own workspace so that it
# does not change the root workspace, its Cargo.lock, or any public contract.
[workspace]

[package]
name = "cross-app-spike"
version = "0.0.0"
edition = "2024"
# File::try_lock is used for the single-instance lock on Unix.
rust-version = "1.89"
publish = false

[dependencies]
runtime-core = { path = "../../crates/runtime-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading"] }

[[bin]]
name = "spike-broker"
path = "src/bin/spike-broker.rs"

[[bin]]
name = "spike-client"
path = "src/bin/spike-client.rs"

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
