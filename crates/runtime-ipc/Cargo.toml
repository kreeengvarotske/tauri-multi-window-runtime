
[package]
name = "runtime-ipc"
version = "0.1.0"
edition = "2024"

[dependencies]
runtime-core = { path = "../runtime-core" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
