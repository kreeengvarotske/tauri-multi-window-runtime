name: Runtime adapter

on:
  # Allow release verification when the automatic push run is absent.
  workflow_dispatch:
  # The release revision is a commit on main or a preview tag, so both are
  # tested at their exact SHA, not only the pull request that produced them.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "tests/consumers/**"
      - "examples/runtime-adapter-demo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/runtime-adapter.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Tests and the demo's --self-test on a real window system. Hosted
  # runners are not a native Windows 10/11 machine; native runs are
  # reported separately.
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Independent notes backend consumer at the PR source revision
        shell: pwsh
        run: ./tests/consumers/Test-WindowNotes.ps1 -Revision '${{ github.event.pull_request.head.sha || github.sha }}' -OutputParent '${{ runner.temp }}'
      - name: Independent notes desktop application at the PR source revision
        shell: pwsh
        run: ./tests/consumers/Test-WindowNotes.ps1 -Revision '${{ github.event.pull_request.head.sha || github.sha }}' -OutputParent '${{ runner.temp }}' -Desktop
      - name: Run the SDK recipes
        shell: bash
        run: |
          set -euo pipefail
          for recipe in shared window io; do
            cargo run -p shared-runtime --locked --example recipes -- "$recipe"
          done
      - name: Core crates have no Tauri dependency
        shell: bash
        run: |
          for crate in runtime-core shared-runtime; do
            # One package name per line, so a path containing "tauri"
            # (the checkout directory) does not match.
            if cargo tree -p "$crate" -e normal --locked --prefix none --format '{p}' | grep -E '^tauri'; then
              echo "$crate depends on Tauri"; exit 1
            fi
          done
      - run: cargo build -p runtime-adapter-demo --locked
      - name: Self-test on Linux (Xvfb)
        if: runner.os == 'Linux'
        run: |
          timeout 120 xvfb-run -a target/debug/runtime-adapter-demo --self-test self-test.json
          cat self-test.json
          jq -e '.passed == true and .catalogExecutions == 1 and .catalogCacheEntries == 1 and .queuedViewSeparated == true and .queuedViewCacheStable == true and .projectionQueueBounded == true and .projectionQueueEmptyAfterExit == true and .refusedAfterExit == true and .cachesEmptyAfterExit == true' self-test.json
      - name: Self-test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path (Get-Location) 'self-test.json'
          $app = Start-Process -FilePath 'target\debug\runtime-adapter-demo.exe' -ArgumentList @('--self-test', "`"$report`"") -PassThru -WindowStyle Hidden
          $null = $app.Handle
          if (-not $app.WaitForExit(120000)) { Stop-Process -Id $app.Id -Force; throw 'self-test did not finish within 120 s' }
          if (-not (Test-Path $report)) { throw "no report (exit code $($app.ExitCode))" }
          Get-Content $report -Raw | Write-Host
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($app.ExitCode -ne 0 -or $result.passed -ne $true -or
              $result.catalogExecutions -ne 1 -or $result.catalogCacheEntries -ne 1 -or
              $result.queuedViewSeparated -ne $true -or $result.queuedViewCacheStable -ne $true -or
              $result.projectionQueueBounded -ne $true -or $result.projectionQueueEmptyAfterExit -ne $true -or
              $result.refusedAfterExit -ne $true -or $result.cachesEmptyAfterExit -ne $true) {
            throw 'Self-test did not produce the required catalog and shutdown evidence.'
          }
      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-adapter-self-test-${{ matrix.os }}-${{ github.sha }}
          path: self-test.json
          if-no-files-found: warn
      - name: Upload independent consumer identities and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-consumers-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tmwr-notes-*/consumer-result.json
            ${{ runner.temp }}/tmwr-notes-*/native-report.json
            ${{ runner.temp }}/tmwr-notes-*/Cargo.toml
            ${{ runner.temp }}/tmwr-notes-*/Cargo.lock
          if-no-files-found: warn
