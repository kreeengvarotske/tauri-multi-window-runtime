name: Windows process monitor smoke test

on:
  pull_request:
    paths:
      - "benchmarks/windows/**"
      - ".github/workflows/process-monitor-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "benchmarks/windows/**"
      - ".github/workflows/process-monitor-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run monitor with fractional sample interval
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ("OS: " + [System.Environment]::OSVersion.VersionString)
          Write-Host ("PowerShell: " + $PSVersionTable.PSVersion.ToString())

          # Do not monitor the PowerShell harness itself: it allocates while the
          # script is running, making back-to-back memory-counter comparisons noisy.
          # A stable long-lived cmd/ping process provides a predictable smoke target.
          $target = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\cmd.exe') -ArgumentList '/c', 'ping -n 20 127.0.0.1 > NUL' -PassThru
          try {
            $output = Join-Path $env:RUNNER_TEMP 'process-monitor-smoke.csv'
            & .\benchmarks\windows\Measure-ProcessTree.ps1 -RootPid $target.Id -DurationSeconds 4 -SampleIntervalSeconds 0.2 -OutputPath $output

            if (-not (Test-Path -LiteralPath $output)) {
              throw "The monitor did not create its CSV output."
            }

            $rows = @(Import-Csv -LiteralPath $output)
            if ($rows.Count -lt 2) {
              throw "Expected at least two samples for the fractional-interval smoke test; got $($rows.Count)."
            }

            $requiredColumns = @('IntervalSeconds', 'WorkingSetMB', 'PrivateBytesMB', 'PrivateMissingCount', 'CpuUnreadableCount')
            foreach ($column in $requiredColumns) {
              if (-not ($rows[0].PSObject.Properties.Name -contains $column)) {
                throw "Missing expected CSV column: $column"
              }
            }

            $invariant = [System.Globalization.CultureInfo]::InvariantCulture
            $intervals = @()
            foreach ($row in $rows) {
              if ([string]::IsNullOrWhiteSpace($row.IntervalSeconds) -or
                  [string]::IsNullOrWhiteSpace($row.WorkingSetMB) -or
                  [string]::IsNullOrWhiteSpace($row.PrivateBytesMB)) {
                throw "Required measurement field was blank in sample $($row.Sample)."
              }
              $intervals += [double]::Parse($row.IntervalSeconds, $invariant)
            }

            $sortedIntervals = @($intervals | Sort-Object)
            $medianInterval = $sortedIntervals[[int][Math]::Floor($sortedIntervals.Count / 2)]
            if ($medianInterval -ge 0.75) {
              throw "Fractional interval was not reflected in actual samples: median IntervalSeconds=$medianInterval, expected below 0.75."
            }

            Write-Host ("Smoke test passed: {0} samples; requested interval 0.2 s; median actual interval {1} s." -f $rows.Count, $medianInterval)
          }
          finally {
            if (Get-Process -Id $target.Id -ErrorAction SilentlyContinue) {
              Stop-Process -Id $target.Id -Force -ErrorAction SilentlyContinue
            }
          }
