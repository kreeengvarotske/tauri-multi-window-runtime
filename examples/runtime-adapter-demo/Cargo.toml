[package]
name = "runtime-adapter-demo"
version = "0.1.0"
description = "Minimal Tauri app integrating shared-runtime through shared-runtime-tauri"
edition = "2024"
publish = false

[lib]
name = "runtime_adapter_demo"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared-runtime = { path = "../../crates/shared-runtime" }
shared-runtime-tauri = { path = "../../crates/shared-runtime-tauri" }
tauri = { version = "2" }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
