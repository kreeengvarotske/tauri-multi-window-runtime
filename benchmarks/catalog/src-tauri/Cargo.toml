[package]
name = "catalog-bench"
version = "0.1.0"
description = "Memory benchmark scenario M: one catalog, per-window copies (arm A) or one shared Rust copy (arm B)"
edition = "2024"
publish = false

[lib]
name = "catalog_bench_lib"
crate-type = ["rlib"]

[features]
# Arm is fixed at compile time. Without features: arm A, every window loads
# and keeps its own copy of the catalog in JS. With `shared`: arm B, a
# hand-written Rust service keeps one copy and windows request bounded views.
shared = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
