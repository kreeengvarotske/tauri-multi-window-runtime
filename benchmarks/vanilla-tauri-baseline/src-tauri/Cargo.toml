[workspace]
resolver = "3"

[package]
name = "vanilla-tauri-baseline"
version = "0.1.0"
description = "Vanilla Tauri performance baseline without coalescing or cache"
authors = ["Tauri Multi-Window Runtime contributors"]
edition = "2024"

[lib]
name = "vanilla_tauri_baseline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = "=2.12.5"
tokio = { version = "=1.54.1", features = ["time"] }

# Same release profile as the Runtime Lab workspace root (`Cargo.toml`), so
# the two executables are built with identical optimisation settings. This
# crate has its own `[workspace]`, so the root profile does not apply here.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
