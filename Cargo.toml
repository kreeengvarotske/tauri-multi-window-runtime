[workspace]
resolver = "3"
members = [
    "crates/runtime-core",
    "crates/runtime-ipc",
    "crates/shared-runtime",
    "src-tauri",
    "benchmarks/symmetric/src-tauri",
    "benchmarks/catalog/src-tauri",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
