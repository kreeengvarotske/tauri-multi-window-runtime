[package]
name = "tauri-multi-window-runtime"
version = "0.1.0"
description = "Tauri Multi-Window Runtime — Runtime Lab"
authors = ["you"]
edition = "2024"

[lib]
name = "tauri_multi_window_runtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
runtime-ipc = { path = "../crates/runtime-ipc" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
